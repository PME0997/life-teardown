name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run validate.py (frontmatter / metadata / links / shared-sync)
        run: python scripts/validate.py .

      - name: Verify shared-src sync (no drift)
        run: |
          bash scripts/sync-shared.sh
          if ! git diff --quiet; then
            echo "::error::shared/ 分发副本与 shared-src/ 不一致。请编辑 shared-src/ 后运行 scripts/sync-shared.sh 并提交。"
            git diff --stat
            exit 1
          fi
          echo "shared-src 与分发副本一致，无漂移。"
